[package]
name = "remote-agent-gpui"
version = "0.1.0"
edition = "2024"
description = "The Remote Agent client for macOS, built with GPUI"
publish = false

[[bin]]
name = "remote-agent-gpui"
path = "src/main.rs"

[dependencies]
# GPUI and its component library, as one crate. It pins its own GPUI snapshot
# (gpui-pre); bump the two together.
gpui-kit = { version = "=0.10.0", features = ["speech"] }
alacritty_terminal = "0.26"
anyhow = "1"
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
core-foundation = "0.10"
core-text = "21"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
gethostname = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp"] }
# Sparkle, the release build's updater, loaded at launch (src/ui/sparkle.rs),
# and the Dock's badge and bounce (src/ui/dock.rs).
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSError", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotificationSettings", "UNUserNotificationCenter"] }
security-framework = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-tungstenite = "0.30"
ureq = { version = "3", default-features = false, features = ["json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
# Cargo strips the standard library's debug info from a release build, about
# 70 KB of 37 MB here, with the toolchain's rust-objcopy. Rust 1.100's can't
# find its libLLVM.dylib on macOS, so every build warned that stripping failed.
strip = "none"

[profile.dev]
# GPUI is slow unoptimized; keep our own crate quick to rebuild.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
