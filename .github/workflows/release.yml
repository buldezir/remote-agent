# Builds rad for Linux and macOS (arm64 and x86-64), and the Mac apps, Remote
# Agent and Remote Agent Server, for Apple silicon. Checks that the web client
# builds; it isn't published yet. Pushing a tag like v0.2.0 publishes them as that tag's
# release; running the workflow by hand only keeps them as run artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  rad:
    name: rad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test
        working-directory: server
        run: |
          unformatted=$(gofmt -l internal cmd)
          if [ -n "$unformatted" ]; then echo "::error::gofmt: $unformatted"; exit 1; fi
          go vet ./...
          go test -race ./...
      - name: Build
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then version=${GITHUB_REF_NAME#v}; else version=$(git describe --tags --always); fi
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/}
            out=$RUNNER_TEMP/$os-$arch
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go -C server build -trimpath \
              -ldflags "-s -w -X remote-agent/internal/api.Version=$version" -o "$out/rad" ./cmd/rad
            tar -C "$out" -czf "dist/rad-$os-$arch.tar.gz" rad
          done
      - uses: actions/upload-artifact@v7
        with:
          name: rad
          path: dist/
          if-no-files-found: error

  web:
    name: web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mac:
    name: ${{ matrix.app }}
    # The apps target macOS 27, which needs Xcode 27; the macos-26 image only
    # has Xcode 26. xcode-27 runs on Apple silicon, and so does macOS 27.
    runs-on: xcode-27
    strategy:
      matrix:
        include:
          - scheme: RemoteAgent-macOS
            app: Remote Agent
            asset: Remote-Agent-macOS-arm64.zip
          - scheme: RemoteAgentServer
            app: Remote Agent Server
            asset: Remote-Agent-Server-macOS-arm64.zip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7   # build-rad.sh compiles rad into the Server app
        if: matrix.scheme == 'RemoteAgentServer'
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build
        working-directory: apple
        run: |
          xcodebuild -version
          # Tags set the app's version (and that of rad inside the Server app);
          # other runs keep project.yml's.
          version=()
          if [[ $GITHUB_REF == refs/tags/v* ]]; then version=(MARKETING_VERSION="${GITHUB_REF_NAME#v}"); fi
          xcodegen
          # No team or Developer ID here, so the app is signed ad hoc.
          xcodebuild -project RemoteAgent.xcodeproj -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            ARCHS=arm64 DEVELOPMENT_TEAM= CODE_SIGN_IDENTITY=- "${version[@]}" build
        env:
          SCHEME: ${{ matrix.scheme }}
      - name: Package
        run: |
          app="apple/build/Build/Products/Release/$APP.app"
          codesign --verify --deep --strict "$app"
          for exe in "$app"/Contents/MacOS/*; do lipo -archs "$exe"; done
          plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist"
          if [ -e "$app/Contents/MacOS/rad" ]; then "$app/Contents/MacOS/rad" version; fi
          mkdir dist
          ditto -c -k --keepParent "$app" "dist/$ASSET"
        env:
          APP: ${{ matrix.app }}
          ASSET: ${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: mac-${{ matrix.scheme }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rad, web, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NOTES: |
            - **rad** (`rad-<os>-<arch>.tar.gz`): the server for Linux and macOS. Unpack it, put `rad` on your PATH and run `rad serve`. From then on, `rad update` installs new releases.
            - **Remote Agent** (`Remote-Agent-macOS-arm64.zip`): the client app for the Mac.
            - **Remote Agent Server** (`Remote-Agent-Server-macOS-arm64.zip`): the menu bar app that runs rad on a Mac.
            - **Web client**: the Docker image `ghcr.io/buldezir/remote-agent-web`, tagged `latest` and with the version, such as `0.2.0`. `web/compose.example.yaml` runs it.

            Both Mac apps need macOS 27 on Apple silicon. They are signed ad hoc, not notarized, so macOS blocks their first launch: allow them under System Settings › Privacy & Security, or run `xattr -dr com.apple.quarantine` on the app. After each update, macOS asks again for the Server app's permissions and for the client's access to its saved pairing tokens. To update only rad, and keep those permissions, use **Update rad** in the Server app's menu.
        run: |
          sums=$(sha256sum *) && echo "$sums" > SHA256SUMS
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" * --clobber
          else
            prerelease=()
            if [[ $TAG == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$TAG" --verify-tag --generate-notes --notes "$NOTES" "${prerelease[@]}" *
          fi
