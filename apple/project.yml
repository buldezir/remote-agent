name: RemoteAgent
options:
  bundleIdPrefix: dev.remote-agent
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true
packages:
  RAKit:
    path: RAKit
  Textual:  # 0.5.0 with fixes to selection and copying, on the remote-agent branch of our fork.
    url: https://github.com/buldezir/textual
    revision: 8dc72c27923e486f5ecc4f1b36423df304a074f8
  SwiftTerm:  # exact: 1.99 is the 2.0 preview, with a different API. Needs Xcode's Metal toolchain.
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0
  Sparkle:  # the Mac apps' updater; scripts/appcast.sh writes its feeds
    url: https://github.com/sparkle-project/Sparkle
    minorVersion: 2.10.0
settings:
  base:
    # Release tags set both: the version, and a build number that only grows
    # (0.3.0-beta.2 → 30002, 0.3.0 → 30099), which Sparkle compares.
    CURRENT_PROJECT_VERSION: "1"
    # Sparkle installs only updates signed with the private half, which is
    # the SPARKLE_PRIVATE_KEY secret (README.md › Development).
    SPARKLE_PUBLIC_KEY: WQontbp7coFEQwc0h6w4Or5DMoyvPz535n1amUTZNqc=
    # The Mac apps' hardened runtime, which notarization needs, is on when
    # they are signed with a team. Signed ad hoc, without one, it would stop
    # them from loading Sparkle.framework: library validation wants the app
    # and the framework to share a Team ID, and ad hoc code has none.
    HARDENED_RUNTIME_WITHOUT_TEAM: NO
# Both client apps build Shared/ plus their own folder. Small differences
# inside a shared file sit in #if os(iOS) / #if os(macOS). RemoteAgentServer
# is the Mac menu bar app that runs rad; it shares no code with them.
targets:
  RemoteAgent-iOS:
    type: application
    platform: iOS
    sources:
      - Shared
      - path: iOS
        excludes: [Info.plist]
    dependencies:
      - package: RAKit
      - package: Textual
      - package: SwiftTerm
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Remote Agent
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only the encryption that comes with iOS (TLS), which is exempt, so
        # TestFlight doesn't hold each build for the export compliance question.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false  # one window on iPad, as on the Mac
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Scan the pairing QR code printed by `rad pair`.
        NSLocalNetworkUsageDescription: Connect to rad running on your computer.
        NSMicrophoneUsageDescription: Dictate messages to your agents.
        NSSpeechRecognitionUsageDescription: Turn your dictation into text.
        NSPhotoLibraryAddUsageDescription: Save images from your sessions, such as an agent's screenshots.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true   # http/ws to IPs and .local names
          NSExceptionDomains:
            ts.net:                       # Tailscale MagicDNS names; WireGuard encrypts the traffic
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.remote-agent.pair
            CFBundleURLSchemes: [remoteagent]
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: RemoteAgent
        PRODUCT_MODULE_NAME: RemoteAgent
        MARKETING_VERSION: "0.1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  RemoteAgent-macOS:
    type: application
    platform: macOS
    sources:
      - Shared
      - path: macOS
        excludes: [Info.plist, RemoteAgent.entitlements]
    dependencies:
      - package: RAKit
      - package: Textual
      - package: SwiftTerm
      - package: Sparkle
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Remote Agent
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Sparkle: the feed is the latest release's (scripts/appcast.sh). The
        # sandboxed app installs through Sparkle's installer service.
        SUFeedURL: https://github.com/buldezir/remote-agent/releases/latest/download/Remote-Agent-macOS-appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        SUEnableInstallerLauncherService: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSLocalNetworkUsageDescription: Connect to rad running on your computer.
        NSMicrophoneUsageDescription: Dictate messages to your agents.
        NSSpeechRecognitionUsageDescription: Turn your dictation into text.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.remote-agent.pair
            CFBundleURLSchemes: [remoteagent]
    entitlements:
      path: macOS/RemoteAgent.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-only: true   # images attached from Files
        # Sparkle's installer service, which replaces the app outside its sandbox.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: Remote Agent
        PRODUCT_MODULE_NAME: RemoteAgent
        MARKETING_VERSION: "0.1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: "$(HARDENED_RUNTIME_$(DEVELOPMENT_TEAM:default=WITHOUT_TEAM):default=YES)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    postBuildScripts:
      - name: Sign Sparkle
        script: exec "$SRCROOT/scripts/sign-sparkle.sh"
        basedOnDependencyAnalysis: false
  RemoteAgentServer:
    type: application
    platform: macOS
    sources:
      - path: ServerApp
        excludes: [Info.plist, RemoteAgentServer.entitlements]
    dependencies:
      - package: Sparkle
    info:
      path: ServerApp/Info.plist
      properties:
        CFBundleDisplayName: Remote Agent Server
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: https://github.com/buldezir/remote-agent/releases/latest/download/Remote-Agent-Server-macOS-appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        # Downloads updates by itself, so that a client can install one
        # without anyone at the Mac (AppUpdater.installForClient).
        SUAutomaticallyUpdate: true
        LSUIElement: true                 # menu bar only, no Dock icon
        LSApplicationCategoryType: public.app-category.developer-tools
        # rad and the agents it starts run as this app's children, so macOS
        # asks for their permissions in its name.
        NSAppleEventsUsageDescription: Your agents can control other apps, for example through System Events or osascript.
        NSDesktopFolderUsageDescription: Your agents can work with files on your Desktop.
        NSDocumentsFolderUsageDescription: Your agents can work with files in your Documents folder.
        NSDownloadsFolderUsageDescription: Your agents can work with files in your Downloads folder.
        NSRemovableVolumesUsageDescription: Your agents can work with files on external drives.
        NSNetworkVolumesUsageDescription: Your agents can work with files on network volumes.
        NSLocalNetworkUsageDescription: Your agents can reach other devices on your network, such as dev servers.
    entitlements:
      path: ServerApp/RemoteAgentServer.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: Remote Agent Server
        PRODUCT_MODULE_NAME: RemoteAgentServer
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).server
        MARKETING_VERSION: "0.1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: "$(HARDENED_RUNTIME_$(DEVELOPMENT_TEAM:default=WITHOUT_TEAM):default=YES)"
        ENABLE_USER_SCRIPT_SANDBOXING: NO   # build-rad.sh reads ../server and Go's cache
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    postBuildScripts:
      - name: Build rad
        script: exec "$SRCROOT/scripts/build-rad.sh"
        basedOnDependencyAnalysis: false   # go build has its own cache
      - name: Sign Sparkle
        script: exec "$SRCROOT/scripts/sign-sparkle.sh"
        basedOnDependencyAnalysis: false
schemes:
  RemoteAgent-iOS:
    build:
      targets:
        RemoteAgent-iOS: all
    run:
      config: Debug
  RemoteAgent-macOS:
    build:
      targets:
        RemoteAgent-macOS: all
    run:
      config: Debug
  RemoteAgentServer:
    build:
      targets:
        RemoteAgentServer: all
    run:
      config: Debug
