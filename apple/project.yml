name: RemoteAgent
options:
  bundleIdPrefix: dev.remote-agent
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true
packages:
  RAKit:
    path: RAKit
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.1
# Both apps build Shared/ plus their own folder. Small differences inside a
# shared file sit in #if os(iOS) / #if os(macOS).
targets:
  RemoteAgent-iOS:
    type: application
    platform: iOS
    sources:
      - Shared
      - path: iOS
        excludes: [Info.plist]
    dependencies:
      - package: RAKit
      - package: MarkdownUI
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Remote Agent
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Scan the pairing QR code printed by `rad pair`.
        NSLocalNetworkUsageDescription: Connect to rad running on your computer.
        NSMicrophoneUsageDescription: Dictate messages to your agents.
        NSSpeechRecognitionUsageDescription: Turn your dictation into text.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true   # http/ws to IPs and .local names
          NSExceptionDomains:
            ts.net:                       # Tailscale MagicDNS names; WireGuard encrypts the traffic
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.remote-agent.pair
            CFBundleURLSchemes: [remoteagent]
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: RemoteAgent
        PRODUCT_MODULE_NAME: RemoteAgent
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  RemoteAgent-macOS:
    type: application
    platform: macOS
    sources:
      - Shared
      - path: macOS
        excludes: [Info.plist, RemoteAgent.entitlements]
    dependencies:
      - package: RAKit
      - package: MarkdownUI
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Remote Agent
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSLocalNetworkUsageDescription: Connect to rad running on your computer.
        NSMicrophoneUsageDescription: Dictate messages to your agents.
        NSSpeechRecognitionUsageDescription: Turn your dictation into text.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.remote-agent.pair
            CFBundleURLSchemes: [remoteagent]
    entitlements:
      path: macOS/RemoteAgent.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.audio-input: true
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: Remote Agent
        PRODUCT_MODULE_NAME: RemoteAgent
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
schemes:
  RemoteAgent-iOS:
    build:
      targets:
        RemoteAgent-iOS: all
    run:
      config: Debug
  RemoteAgent-macOS:
    build:
      targets:
        RemoteAgent-macOS: all
    run:
      config: Debug
