name: RemoteAgent
options:
  bundleIdPrefix: dev.remote-agent
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  RAKit:
    path: RAKit
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.1
targets:
  RemoteAgent:
    type: application
    platform: iOS
    sources:
      - RemoteAgent
    dependencies:
      - package: RAKit
      - package: MarkdownUI
    info:
      path: RemoteAgent/Info.plist
      properties:
        CFBundleDisplayName: Remote Agent
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Scan the pairing QR code printed by `rad pair`.
        NSLocalNetworkUsageDescription: Connect to rad running on your computer.
        NSMicrophoneUsageDescription: Dictate messages to your agents.
        NSSpeechRecognitionUsageDescription: Turn your dictation into text.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true   # http/ws to IPs and .local names
          NSExceptionDomains:
            ts.net:                       # Tailscale MagicDNS names; WireGuard encrypts the traffic
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.remote-agent.pair
            CFBundleURLSchemes: [remoteagent]
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
schemes:
  RemoteAgent:
    build:
      targets:
        RemoteAgent: all
    run:
      config: Debug
